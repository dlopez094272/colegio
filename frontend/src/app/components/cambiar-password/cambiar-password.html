<div class="modal-overlay cambiar-overlay">
  <div class="cambiar-box">
    <div class="cambiar-header">
      <div class="key-icon">🔑</div>
      <h3 class="cambiar-title">Cambio de contraseña requerido</h3>
    </div>
    <p class="cambiar-desc">
      Hola <strong>{{ nombre }}</strong>, por seguridad debes cambiar tu contraseña antes de continuar.
    </p>

    <form (ngSubmit)="submit()" class="cambiar-form">
      <div class="field">
        <label class="col-label">Nueva contraseña</label>
        <input class="col-input" type="password" [(ngModel)]="newPassword"
               name="newPwd" placeholder="Mínimo 4 caracteres" required/>
      </div>
      <div class="field">
        <label class="col-label">Confirmar contraseña</label>
        <input class="col-input" type="password" [(ngModel)]="confirm"
               name="confirm" placeholder="Repite la contraseña" required/>
      </div>

      @if (error) {
        <div class="alert-error">{{ error }}</div>
      }

      <button type="submit" class="btn-col primary full-btn" [disabled]="loading">
        @if (loading) { <span class="spinner"></span> } Cambiar contraseña
      </button>
    </form>
  </div>
</div>
