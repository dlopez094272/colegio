<header class="topbar">

  <!-- Izquierda: toggle sidebar + título de página -->
  <div class="topbar-left">
    <button class="toggle-btn" (click)="layout.toggle()" [title]="layout.collapsed() ? 'Expandir menú' : 'Contraer menú'">
      @if (layout.collapsed()) {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="15" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
          <polyline points="11 9 8 12 11 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
    </button>

    <div class="topbar-sep"></div>
    <h2>{{ pageTitle }}</h2>
  </div>

  <!-- Derecha: fecha + usuario + salir -->
  <div class="topbar-right">
    <span class="fecha-txt">{{ fecha }}</span>
    <div class="status-dot" title="Sistema activo"></div>
    <div class="topbar-divider"></div>

    <div class="user-section">
      <div class="user-avatar">{{ avatarLetter }}</div>
      <div class="user-info">
        <span class="user-name">{{ displayName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
      <button class="logout-btn" (click)="auth.logout()" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Salir</span>
      </button>
    </div>
  </div>

</header>
